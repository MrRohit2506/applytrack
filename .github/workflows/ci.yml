# NOTE: `npm ci` requires package-lock.json files. Run `npm run install:all` once locally and commit server/package-lock.json and client/package-lock.json.
name: CI
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test # starts an in-memory MongoDB (mongodb-memory-server), never a real database
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory: review findings, do not blindly upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix client audit --omit=dev --audit-level=high
